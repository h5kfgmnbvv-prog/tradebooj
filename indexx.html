<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tradebook · Mercado mayorista de México</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6b6b;--line:#e7e5e2;--soft:#f7f5f3;--or:#f26b1d;--ord:#d9560c;--orl:#fff1e8}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f4f2ef;--mut:#a09b95;--line:#2c2a28;--soft:#1b1a19;--orl:#2a1a10}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.lg{width:34px;height:34px;background:var(--or);border-radius:8px;color:#fff;font-weight:700;font-size:22px;display:grid;place-items:center;letter-spacing:0}
nav{margin-left:auto;display:flex;gap:20px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;align-items:center}nav a,nav span{cursor:pointer}nav a:hover,nav span:hover{color:var(--or)}
.btn{display:inline-block;border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:11px 22px;font:500 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
.or{background:var(--or);border-color:var(--or);color:#fff}.ln{background:transparent;color:var(--fg)}.sm{padding:7px 12px;font-size:11px}
.hero{background:var(--soft);padding:72px 0;text-align:center;border-bottom:1px solid var(--line)}
.hero h1{font-weight:500;font-size:clamp(28px,5vw,48px);margin:0 0 12px;line-height:1.1}.hero p{color:var(--mut);max-width:520px;margin:0 auto 28px}
.sr{display:flex;max-width:560px;margin:0 auto;border:1px solid var(--fg);background:var(--bg)}
.sr input{flex:1;border:0;padding:14px 16px;background:transparent;color:var(--fg);font:inherit;outline:0}.sr button{border:0;background:var(--or);color:#fff;padding:0 22px;cursor:pointer;text-transform:uppercase;font-size:12px}
.chips{display:flex;gap:8px;padding:22px 0;overflow-x:auto}.chip{border:1px solid var(--line);padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px 18px;padding-bottom:60px}.card{cursor:pointer}
.ph{aspect-ratio:4/5;background:var(--soft);display:grid;place-items:center;font-size:72px;font-weight:300;color:var(--or);position:relative;border:1px solid var(--line)}.card:hover .ph{background:var(--orl)}
.vf,.pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px}.vf{position:absolute;top:10px;left:10px;background:var(--bg);border:1px solid var(--line)}.pill{background:var(--orl);color:var(--or)}
.card h3{margin:10px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.06em}.mut{color:var(--mut);font-size:12px}.sec{font-size:12px;text-transform:uppercase;letter-spacing:.14em;margin:12px 0;font-weight:600}
.pg{padding:40px 0 70px;max-width:720px;margin:0 auto}.pg h2{font-weight:500;font-size:30px;margin:0 0 6px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}form .f{grid-column:1/-1}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:11px;font:inherit}input:focus,select:focus,textarea:focus{outline:1px solid var(--or)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:20;padding:16px}.mo.on{display:grid}
.md{background:var(--bg);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:28px;position:relative}.x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--fg)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:20px 0;overflow-x:auto}.tab{padding:10px 16px;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid transparent;white-space:nowrap}.tab.on{border-color:var(--or);color:var(--or)}
.row{border:1px solid var(--line);padding:14px;margin-bottom:10px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.note{background:var(--orl);padding:12px 14px;font-size:12px;border-left:3px solid var(--or);margin:14px 0}
footer{background:var(--soft);border-top:1px solid var(--line);padding:32px 0;color:var(--mut);font-size:12px}
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;z-index:30;display:none}
@media(max-width:640px){form{grid-template-columns:1fr}nav a.h{display:none}}
</style></head><body>
<header><div class="w bar"><a href="#inicio" class="logo"><span class="lg">T</span>Tradebook</a><nav id="nv"></nav></div></header>
<main id="app"></main>
<footer><div class="w">© 2026 Tradebook · Mercado mayorista B2B de México</div></footer>
<div class="mo" id="mo" onclick="if(event.target===this)cm()"><div class="md" id="md"></div></div><div class="tt" id="tt"></div>
<script>
// ====== 1) PEGA AQUÍ TUS DATOS DE SUPABASE (Project Settings > API) ======
var SUPA_URL="https://sgnfvdtpvjpoakpqohdb.supabase.co";
var SUPA_KEY="sb_publishable_0kxj3GnlF1J5fbrUgWk48Q_q68olbuW";
// =========================================================================
var CATS=["Artesanías","Alimentos","Bebidas","Textiles","Joyería","Muebles","Cosmética","Agro"];
var EDOS=["Aguascalientes","Baja California","CDMX","Chiapas","Chihuahua","Guanajuato","Guerrero","Jalisco","Estado de México","Michoacán","Nuevo León","Oaxaca","Puebla","Querétaro","Yucatán","Otro"];
var sb,U=null,ADM=false,BZ={},fcat="",fq="",atab="pend",mode="login";
function $(i){return document.getElementById(i)}
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("tt");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},3000)}
function om(h){$("md").innerHTML='<button class="x" onclick="cm()">×</button>'+h;$("mo").className="mo on"}function cm(){$("mo").className="mo"}
function err(r){if(r.error){toast(r.error.message);return true}return false}

async function render(){
 var h=(location.hash||"#inicio").slice(1);
 $("nv").innerHTML='<a href="#inicio" class="h">Proveedores</a><a href="#vender">Vende en Tradebook</a>'+(ADM?'<a href="#admin">Panel</a>':'')+(U?'<span onclick="out()">Salir</span>':'');
 $("app").innerHTML=h==="vender"?await sell():h==="admin"?await adminV():await home();
}
async function home(){
 var r=await sb.from("businesses").select("*").eq("status","approved").order("created_at",{ascending:false});BZ={};
 var l=(r.data||[]).filter(function(b){BZ[b.id]=b;return(!fcat||b.cat===fcat)&&(!fq||(b.name+b.prods+b.descr+b.edo).toLowerCase().indexOf(fq.toLowerCase())>-1)});
 return'<section class="hero"><div class="w"><h1>El mercado mayorista<br>de México, en un solo lugar</h1><p>Conecta con fabricantes, productores y artesanos verificados. Cotiza directo, sin intermediarios.</p><div class="sr"><input id="q" placeholder="Busca productos o proveedores" value="'+E(fq)+'" onkeydown="if(event.key===\'Enter\')sq()"><button onclick="sq()">Buscar</button></div></div></section><div class="w"><div class="chips"><span class="chip '+(fcat?'':'on')+'" onclick="sc(\'\')">Todos</span>'+CATS.map(function(c){return'<span class="chip '+(fcat===c?'on':'')+'" onclick="sc(\''+c+'\')">'+c+'</span>'}).join("")+'</div><div class="sec">'+l.length+' proveedores</div><div class="grid">'+(l.length?l.map(function(b){return'<div class="card" onclick="det(\''+b.id+'\')"><div class="ph">'+E(b.name[0])+(b.verified?'<span class="vf">Verificado</span>':'')+'</div><h3>'+E(b.name)+'</h3><div class="mut">'+E(b.cat)+' · '+E(b.edo)+'</div><div class="mut">Pedido mín.: '+E(b.moq)+'</div></div>'}).join(""):'<p class="mut">Aún no hay proveedores publicados.</p>')+'</div></div>'}
function sc(c){fcat=c;render()}function sq(){fq=$("q").value;render()}
function det(id){var b=BZ[id];om('<div class="mut">'+E(b.cat)+' · '+E(b.edo)+'</div><h2 style="font-weight:500;margin:4px 0 10px">'+E(b.name)+(b.verified?' <span class="pill">Verificado</span>':'')+'</h2><p>'+E(b.descr)+'</p><p class="mut"><b>Productos:</b> '+E(b.prods)+'<br><b>Pedido mínimo:</b> '+E(b.moq)+'</p><div class="sec">Solicitar cotización</div><form onsubmit="return lead(event,\''+id+'\')"><div><label>Tu nombre</label><input name="n" required></div><div><label>Empresa</label><input name="e"></div><div class="f"><label>Correo o WhatsApp</label><input name="c" required></div><div class="f"><label>¿Qué necesitas y en qué cantidad?</label><textarea name="m" rows="3" required></textarea></div><div class="f"><button class="btn or">Enviar solicitud</button></div></form>')}
async function lead(e,id){e.preventDefault();var f=e.target;var r=await sb.from("leads").insert({business_id:id,name:f.n.value,company:f.e.value,contact:f.c.value,message:f.m.value});if(err(r))return false;cm();toast("Solicitud enviada");return false}

function authF(t){return'<h2>'+t+'</h2><form style="grid-template-columns:1fr;max-width:380px" onsubmit="return auth(event)"><div><label>Correo</label><input type="email" name="e" required></div><div><label>Contraseña (mín. 8)</label><input type="password" name="p" minlength="8" required></div><button class="btn or">'+(mode==="login"?"Entrar":"Crear cuenta")+'</button></form><p class="mut" style="cursor:pointer" onclick="mode=mode===\'login\'?\'signup\':\'login\';render()">'+(mode==="login"?"¿No tienes cuenta? Regístrate":"¿Ya tienes cuenta? Entra")+'</p>'}
async function auth(e){e.preventDefault();var f=e.target,r=mode==="login"?await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value}):await sb.auth.signUp({email:f.e.value,password:f.p.value});if(err(r))return false;if(mode==="signup"&&!r.data.session)toast("Revisa tu correo para confirmar tu cuenta");return false}
async function out(){await sb.auth.signOut();location.hash="inicio"}
function fm(admin){return'<form onsubmit="return '+(admin?'addA':'reg')+'(event)"><div><label>Nombre del negocio</label><input name="name" required></div><div><label>Categoría</label><select name="cat">'+CATS.map(function(c){return'<option>'+c+'</option>'}).join("")+'</select></div>'+(admin?'':'<div><label>Responsable</label><input name="own" required></div><div><label>RFC</label><input name="rfc" required maxlength="13" style="text-transform:uppercase"></div><div><label>WhatsApp</label><input name="tel" required></div><div><label>Correo de contacto</label><input type="email" name="mail" required></div>')+'<div><label>Estado</label><select name="edo">'+EDOS.map(function(c){return'<option>'+c+'</option>'}).join("")+'</select></div><div><label>Pedido mínimo</label><input name="moq" placeholder="Ej. 50 piezas" required></div><div class="f"><label>Productos principales</label><input name="prods" required></div><div class="f"><label>Descripción</label><textarea name="desc" rows="3" required></textarea></div><div class="f"><button class="btn or">'+(admin?'Publicar negocio':'Enviar solicitud de registro')+'</button></div></form>'}
function rec(f){return{name:f.name.value,cat:f.cat.value,edo:f.edo.value,moq:f.moq.value,prods:f.prods.value,descr:f.desc.value}}
async function reg(e){e.preventDefault();var f=e.target,o=rec(f);o.owner_id=U.id;o.owner_name=f.own.value;o.rfc=f.rfc.value.toUpperCase();o.phone=f.tel.value;o.email=f.mail.value;o.status="pending";var r=await sb.from("businesses").insert(o);if(err(r))return false;toast("Solicitud enviada");render();return false}
async function addA(e){e.preventDefault();var o=rec(e.target);o.status="approved";o.verified=true;var r=await sb.from("businesses").insert(o);if(err(r))return false;e.target.reset();toast("Negocio publicado");return false}
async function sell(){
 if(!U)return'<div class="w"><div class="pg">'+authF("Vende en Tradebook")+'<div class="note">Crea tu cuenta, registra tu negocio y nuestro equipo lo revisará antes de publicarlo.</div></div></div>';
 var r=await sb.from("businesses").select("*").eq("owner_id",U.id),m=(r.data||[])[0];
 if(!m)return'<div class="w"><div class="pg"><h2>Registra tu negocio</h2><p class="mut">Revisaremos tu información y te avisaremos cuando tu perfil esté publicado.</p>'+fm(false)+'</div></div>';
 var L=(await sb.from("leads").select("*").eq("business_id",m.id).order("created_at",{ascending:false})).data||[];
 var s={pending:"En revisión",approved:"Publicado",rejected:"Rechazado"}[m.status];
 return'<div class="w"><div class="pg"><h2>'+E(m.name)+'</h2><p><span class="pill">'+s+'</span> '+(m.verified?'<span class="pill">Verificado</span>':'')+'</p><div class="sec" style="margin-top:30px">Cotizaciones recibidas ('+L.length+')</div>'+(L.map(function(l){return'<div class="row"><div><b>'+E(l.name)+'</b> '+E(l.company)+'<div class="mut">'+E(l.contact)+'</div><p style="margin:6px 0 0">'+E(l.message)+'</p></div></div>'}).join("")||'<p class="mut">Aún no hay solicitudes.</p>')+'</div></div>'}

async function adminV(){
 if(!U)return'<div class="w"><div class="pg" style="max-width:380px">'+authF("Acceso administrador")+'</div></div>';
 if(!ADM)return'<div class="w"><div class="pg"><h2>Sin permisos</h2><p class="mut">Esta cuenta no es administradora.</p></div></div>';
 var B=(await sb.from("businesses").select("*").order("created_at",{ascending:false})).data||[],L=(await sb.from("leads").select("*, businesses(name)").order("created_at",{ascending:false})).data||[];
 var f=function(s){return B.filter(function(b){return b.status===s})},P=f("pending");
 var T=[["pend","Pendientes ("+P.length+")"],["apr","Publicados ("+f("approved").length+")"],["rej","Rechazados"],["lead","Cotizaciones ("+L.length+")"],["new","Subir negocio"]],body="";
 var rw=function(b,a){return'<div class="row"><div style="flex:1;min-width:220px"><b>'+E(b.name)+'</b> '+(b.verified?'<span class="pill">Verificado</span>':'')+'<div class="mut">'+E(b.cat)+' · '+E(b.edo)+' · Mín. '+E(b.moq)+'</div>'+(b.owner_name?'<div class="mut">'+E(b.owner_name)+' · RFC '+E(b.rfc)+' · '+E(b.email)+' · '+E(b.phone)+'</div>':'')+'<div>'+E(b.descr)+'</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start">'+a+'</div></div>'};
 var bt=function(l,c,id,x){return'<button class="btn sm '+c+'" onclick="'+x+'">'+l+'</button>'};
 if(atab==="pend")body=P.map(function(b){return rw(b,bt("Aprobar","or",0,"st('"+b.id+"','approved')")+bt("Rechazar","ln",0,"st('"+b.id+"','rejected')"))}).join("")||'<p class="mut">Sin pendientes.</p>';
 else if(atab==="apr")body=f("approved").map(function(b){return rw(b,bt(b.verified?"Quitar sello":"Dar sello","ln",0,"vf('"+b.id+"',"+!b.verified+")")+bt("Despublicar","ln",0,"st('"+b.id+"','rejected')")+bt("Eliminar","ln",0,"del('"+b.id+"')"))}).join("");
 else if(atab==="rej")body=f("rejected").map(function(b){return rw(b,bt("Aprobar","or",0,"st('"+b.id+"','approved')")+bt("Eliminar","ln",0,"del('"+b.id+"')"))}).join("")||'<p class="mut">Vacío.</p>';
 else if(atab==="lead")body=L.map(function(l){return'<div class="row"><div><b>'+E(l.name)+'</b> '+E(l.company)+'<div class="mut">'+E(l.contact)+' → '+E(l.businesses&&l.businesses.name)+' · '+new Date(l.created_at).toLocaleDateString("es-MX")+'</div><p style="margin:6px 0 0">'+E(l.message)+'</p></div></div>'}).join("")||'<p class="mut">Sin cotizaciones.</p>';
 else body='<div style="max-width:720px">'+fm(true)+'</div>';
 return'<div class="w" style="padding-top:30px;min-height:60vh"><h2 style="font-weight:500;margin:0">Panel de administración</h2><div class="tabs">'+T.map(function(t){return'<div class="tab '+(atab===t[0]?'on':'')+'" onclick="atab=\''+t[0]+'\';render()">'+t[1]+'</div>'}).join("")+'</div>'+body+'</div>'}
async function st(id,s){if(!err(await sb.from("businesses").update({status:s}).eq("id",id)))render()}
async function vf(id,v){if(!err(await sb.from("businesses").update({verified:v}).eq("id",id)))render()}
async function del(id){if(confirm("¿Eliminar definitivamente?")&&!err(await sb.from("businesses").delete().eq("id",id)))render()}

if(SUPA_URL.indexOf("PEGA")>-1){$("app").innerHTML='<div class="w"><div class="pg"><h2>Falta conectar Supabase</h2><p class="mut">Abre index.html y pega tu Project URL y tu anon key en las dos primeras líneas del script.</p></div></div>'}
else{sb=supabase.createClient(SUPA_URL,SUPA_KEY);
 sb.auth.onAuthStateChange(function(_e,s){setTimeout(async function(){U=s?s.user:null;ADM=false;if(U){var r=await sb.from("admins").select("user_id").eq("user_id",U.id);ADM=!!(r.data&&r.data.length)}render()},0)});
 window.addEventListener("hashchange",function(){window.scrollTo(0,0);render()})}
</script></body></html>
